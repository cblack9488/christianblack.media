name: Build and deploy

# Builds the site and hands the result straight to GitHub Pages.
#
# Nothing is ever committed back to main, so your local copy can never fall
# behind and you never need to pull before working. main holds only what you
# wrote; the generated pages, sitemap, metadata and reach figures are rebuilt
# on every run and exist only in the deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a week, so the follower counts stay current without anyone pushing.
  # Monday morning UTC. GitHub stops scheduled runs in a repository that has
  # seen no activity for 60 days; a push or a manual run starts them again.
  schedule:
    - cron: '0 11 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Follower and view counts, baked into this build only. Never fails the
      # deploy: with no credentials set it writes an empty file and the pages
      # fall back to whatever is typed into content.js by hand.
      - name: Fetch reach figures
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: npm run reach

      - name: Build
        run: npm run build

      - name: Drop build-only files from what gets published
        run: rm -rf node_modules

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5

        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
