name: Build and deploy

# Builds the site and hands the result straight to GitHub Pages.
#
# Nothing is ever committed back to main, so your local copy can never fall
# behind and you never need to pull before working. main holds only what you
# wrote; the generated pages, sitemap and metadata are rebuilt on every push
# and exist only in the deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Drop build-only files from what gets published
        run: rm -rf node_modules

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5

        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
