name: Pre-render

# Every push regenerates the article pages, the baked-in HTML, the sitemap
# and the head metadata, then commits the result back to main. GitHub Pages
# then publishes from that commit as usual.
#
# A push made with GITHUB_TOKEN does not start another workflow run, so this
# cannot loop back on itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Commit the generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Pre-render pages [skip ci]"
            git push
          fi
